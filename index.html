<style>
/* BodyPassport — дизайн-система v3. Заменяет весь блок <style> в index.html.
   Сетка 8pt, 6 радиусов, 3 тени, единая шкала шрифтов. Контраст текста ≥4.5:1 на --bg и --surface. */
:root{
  /* поверхность */
  --bg:#F3F6F6;--surface:#FFFFFF;--surface-2:#E9EFF0;--line:#DCE4E6;--line-2:#E6ECEE;--figure:#E3EAEC;
  /* текст */
  --ink:#13212B;--text:#13212B;--sub:#5A6872;--faint:#8796A0;/* --faint только иконки и линии */
  --focus:#0E5A6B;
  /* бренд: петроль для кнопок и активных элементов; лайм (--signal) только на тёмном фоне камеры */
  --brand:#0E5A6B;--brand-s:#E3EEF0;--accent:#E9A23B;
  /* источник вывода */
  --src-measured:#13212B;--src-hyp:#2A5CB8;
  /* состояния мышц: заливка / текст / подложка */
  --over:#C8414A;--over-t:#A8323B;--over-s:#FBE6E4;
  --short:#A3561A;--short-t:#8A4512;--short-s:#FCEBDC;
  --weak:#2F6BD8;--weak-t:#24539F;--weak-s:#E3EBFA;
  --ok:#26775D;--ok-t:#1E6A51;--ok-s:#DFF1E7;
  --edge:#8A6A00;--edge-s:#F6EFD6;
  /* тёмная тема: камера, упражнения, плашки 3D */
  --cam-bg:#0A0C0F;--cam-glass:rgba(14,16,20,.74);--cam-line:rgba(255,255,255,.14);
  --cam-text:#F5F6F7;--cam-sub:#B9BDC4;--signal:#D4F25A;--cam-warn:#FFB547;--dark:#13212B;
  /* шрифт */
  --font:Onest,system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --fs-num:56px;--fs-h1:30px;--fs-h2:22px;--fs-h3:17px;--fs-body:16px;--fs-sm:14px;--fs-xs:12px;--fs-cam:44px;--fs-cam-sub:20px;
  /* отступы */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;--gutter:20px;--tap:48px;--btn-h:56px;
  /* радиусы */
  --r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:24px;--r-xl:32px;--r-pill:999px;
  /* тени */
  --sh-1:0 1px 2px rgba(17,20,24,.04),0 1px 1px rgba(17,20,24,.03);
  --sh-2:0 8px 24px rgba(17,20,24,.08),0 1px 3px rgba(17,20,24,.05);
  --sh-3:0 -12px 40px rgba(17,20,24,.16);
  /* движение */
  --ease-out:cubic-bezier(.2,.8,.2,1);--ease-io:cubic-bezier(.65,0,.35,1);--spring:cubic-bezier(.34,1.32,.64,1);
  --d1:120ms;--d2:200ms;--d3:320ms;--d4:560ms;--stagger:60ms;

  /* АЛИАСЫ v2 → v3: старые имена в app.js/pro.js продолжают работать. Удалить после шагов 3–4. */
  --ink2:#1E2533;--coral:var(--short);--coralT:var(--short-t);
  --green:var(--ok);--peach:var(--short-s);--seg:var(--surface-2);
  --hyper:var(--over);--hyperS:var(--over-s);--hyperT:var(--over-t);--shortS:var(--short-s);--shortT:var(--short-t);
  --weakS:var(--weak-s);--weakT:var(--weak-t);--okS:var(--ok-s);--okT:var(--ok-t);
  --r1:var(--r-sm);--r2:var(--r-md);--r3:var(--r-lg);--r4:var(--r-xl);--sh1:var(--sh-1);--sh2:var(--sh-2);
  --ease:var(--ease-out);--t1:var(--d1);--t2:var(--d3);
}
@media (prefers-reduced-motion:reduce){:root{--d1:1ms;--d2:1ms;--d3:1ms;--d4:160ms;--stagger:0ms}}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs-body);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:var(--ink);font-weight:600}a:hover{color:var(--focus)}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.scr{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.pad{padding:0 var(--gutter)}
h1{font-size:var(--fs-h1);font-weight:700;letter-spacing:-.03em;line-height:1.12;text-wrap:pretty}
h2{font-size:var(--fs-h2);font-weight:700;letter-spacing:-.02em;line-height:1.2}
h3{font-size:var(--fs-h3);font-weight:700;line-height:1.3}
.sub{color:var(--sub);font-size:var(--fs-body);line-height:1.5;text-wrap:pretty}
.caps,.eyebrow{font:500 var(--fs-xs)/1.35 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--sub)}
.num,.kpi b,.measure b{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:var(--s3)}
.stack{display:flex;flex-direction:column;gap:var(--s2)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,a,.list-item,[data-k],[data-id]{transition:transform var(--d1) var(--ease-out),background-color var(--d2),border-color var(--d2),box-shadow var(--d2),opacity var(--d2)}
.btn:active,.pill:active,.list-item:active,.round:active,.tile:active,.tool:active{transform:scale(.97)}

/* иконки */
.ic{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:18px;height:18px}

/* кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;height:var(--btn-h);border:0;border-radius:var(--r-md);background:var(--brand);color:#fff;font:600 17px var(--font);letter-spacing:-.01em;cursor:pointer}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn .meta{font:500 13px var(--mono);color:var(--cam-sub)}
.btn.ghost{background:transparent;color:var(--sub);height:var(--tap);font:500 15px var(--font)}
.btn.line{background:var(--surface);border:1px solid var(--line);color:var(--text)}
.btn.signal,.btn.lime{background:var(--signal);color:var(--cam-bg);font-weight:700}/* только на тёмном */
.round{width:var(--tap);height:var(--tap);border-radius:50%;background:transparent;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.round.glass{background:rgba(14,16,20,.6);color:#fff}
.link{background:none;border:0;padding:0;min-height:var(--tap);font:600 15px var(--font);color:var(--focus);cursor:pointer}

/* нижняя зона большого пальца */
.dock{position:sticky;bottom:0;margin-top:auto;padding:var(--s3) var(--gutter) calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:var(--s1);background:linear-gradient(rgba(244,243,239,0),var(--bg) 24%);z-index:4}
.dock.bar{flex-direction:row;gap:var(--s2);border-top:1px solid var(--line-2);background:rgba(244,243,239,.92);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}

/* поверхности */
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--s4)}
.group{background:var(--surface);border-radius:var(--r-md);padding:0 var(--s4)}
.group>*+*{border-top:1px solid var(--line-2)}
.list-item{display:flex;align-items:center;gap:var(--s3);min-height:64px;background:var(--surface);border-radius:var(--r-md);padding:var(--s3) var(--s4);border:1.5px solid transparent;cursor:pointer}
.list-item.on{border-color:var(--ink)}
.chev{color:var(--faint)}
.bar{width:6px;height:36px;border-radius:3px;flex:none}

/* переключатели */
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-pill);padding:3px}
.seg button{flex:1;min-height:40px;border:0;background:transparent;border-radius:var(--r-pill);padding:0 var(--s4);font:600 14px var(--font);color:var(--sub);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(17,20,24,.08)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 var(--s3);border-radius:var(--r-pill);background:var(--surface-2);font:500 14px var(--font);border:1.5px solid transparent;color:var(--text);cursor:pointer}
.pill.on{border-color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:600}

/* источник, состояние, замер */
.src{display:inline-flex;align-items:center;font:500 var(--fs-xs)/1 var(--mono);letter-spacing:.02em;padding:3px 6px;border-radius:5px;background:var(--src-measured);color:#fff;white-space:nowrap}
.src.hyp{background:transparent;color:var(--src-hyp);border:1px dashed var(--src-hyp);padding:2px 5px}
.edge{display:inline-flex;font-size:var(--fs-xs);font-weight:600;color:var(--edge);background:var(--edge-s);padding:2px 6px;border-radius:5px;white-space:nowrap}
.mark{display:inline-block;flex:none;width:14px;height:14px;box-sizing:border-box}
.mark.HYPER{border-radius:50%;background:var(--over)}
.mark.SHORT{width:11px;height:11px;margin:1.5px;background:var(--short);transform:rotate(45deg)}
.mark.WEAK{border-radius:50%;border:3.5px solid var(--weak)}
.mark.OK{border-radius:50%;background:var(--ok-s);position:relative}.mark.OK::after{content:'';position:absolute;left:4px;top:2px;width:4px;height:7px;border:solid var(--ok-t);border-width:0 2px 2px 0;transform:rotate(45deg)}
.verdict-row{display:flex;gap:var(--s3);padding:var(--s3) 0}.verdict-row+.verdict-row{border-top:1px solid var(--line-2)}
.verdict-row .mark{margin-top:4px}.verdict-row .what{font-size:var(--fs-h3);line-height:1.3}
.verdict-row .why{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:13px;color:var(--sub)}
.measure{display:flex;align-items:baseline;gap:var(--s2)}
.measure b{font-size:var(--fs-num);line-height:1;font-weight:600;letter-spacing:-.04em}
.measure u{text-decoration:none;font:500 20px var(--mono);color:var(--sub)}
.measure.sm b{font-size:22px;letter-spacing:-.02em}
.mrow{display:flex;align-items:baseline;gap:var(--s2)}.mrow i{font:500 var(--fs-xs) var(--mono);color:var(--sub);font-style:normal}.mrow span{flex:1;font-size:var(--fs-sm);line-height:1.3}.mrow b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.delta{display:flex;align-items:baseline;gap:var(--s3)}.delta s{text-decoration:none;font-size:32px;color:var(--faint);font-variant-numeric:tabular-nums}.delta b{font-size:var(--fs-num);line-height:1;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ondevice{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}

/* плитки и цифры «Сегодня» */
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.kpi div{background:var(--surface);border-radius:var(--r-md);padding:var(--s3)}
.kpi b{display:block;font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.kpi span{font-size:var(--fs-xs);color:var(--sub);line-height:1.3}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
.tool{height:80px;border:0;border-radius:var(--r-md);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:500 var(--fs-xs) var(--font);color:var(--text);cursor:pointer}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}/* v2, оставить до миграции */
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:88px;padding:var(--s4);border:0;border-radius:var(--r-md);background:var(--surface);font:600 15px var(--font);color:var(--text);text-align:left;cursor:pointer}
.tile small{font-weight:400;font-size:var(--fs-xs);color:var(--sub)}
.tile .ti{width:32px;height:32px;border-radius:var(--r-xs);background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.trust{display:none}/* v2: заменён .ondevice */

/* формы */
.field{width:100%;height:56px;border-radius:var(--r-md);border:1.5px solid var(--line);padding:0 var(--s4);font:17px var(--font);background:var(--surface);color:var(--text)}
.field:focus{border-color:var(--ink);outline:none}
.check{width:24px;height:24px;flex:none;accent-color:var(--ink)}
details>summary{cursor:pointer;list-style:none;min-height:var(--tap);display:flex;align-items:center}details>summary::-webkit-details-marker{display:none}

/* состояния: загрузка, пусто, ошибка, тост */
.skel{border-radius:var(--r-md);background:linear-gradient(90deg,var(--surface-2) 0,#F7F6F2 50%,var(--surface-2) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty,.error{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s3);padding:var(--s6) var(--s5)}
.empty .ic,.error .ic{width:40px;height:40px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);max-width:calc(100% - 40px);background:var(--ink);color:#fff;border-radius:var(--r-md);padding:var(--s3) var(--s4);font-size:var(--fs-sm);box-shadow:var(--sh-2);z-index:40;animation:up var(--d3) var(--ease-out)}

/* камера (тёмная тема) */
.cam{position:fixed;inset:0;background:var(--cam-bg);z-index:5;color:var(--cam-text)}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cam video{background:var(--cam-bg)}.cam canvas{background:transparent;pointer-events:none}
.cam .frame{display:none}/* v2 цветная рамка → контур .silhouette + статус */
.cam .silhouette{position:absolute;inset:0;pointer-events:none}
.cam .top{position:absolute;left:var(--gutter);right:var(--s4);top:calc(env(safe-area-inset-top) + 12px);display:flex;align-items:center;gap:var(--s3)}
.segs{flex:1;display:flex;gap:4px}.segs div{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}.segs div b{display:block;height:100%;background:var(--signal);width:0;transition:width .3s linear}
.glass{position:absolute;left:var(--s3);right:var(--s3);bottom:calc(env(safe-area-inset-bottom) + 28px);background:var(--cam-glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--cam-line);border-radius:var(--r-xl);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);color:var(--cam-text)}
.cam-status{display:flex;align-items:center;gap:var(--s2);font:500 var(--fs-xs) var(--mono);letter-spacing:.04em;color:var(--cam-sub)}
.cam-status.warn{color:var(--cam-warn)}.cam-status.ok{color:var(--signal)}
.cam-title{font-size:var(--fs-cam);line-height:1.02;font-weight:700;letter-spacing:-.035em}
.cam-sub{display:flex;gap:var(--s2);font-size:var(--fs-cam-sub);line-height:1.3;color:var(--cam-sub)}
.cam-bar{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}.cam-bar b{display:block;height:100%;width:0;background:var(--signal);border-radius:4px;transition:width .15s linear}
.cam-btn{height:var(--tap);padding:0 18px;border-radius:var(--r-pill);border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:600 16px var(--font);cursor:pointer}
.reps{position:absolute;right:var(--gutter);top:calc(env(safe-area-inset-top) + 88px);display:flex;flex-direction:column;align-items:flex-end;pointer-events:none}
.reps b{font-size:88px;line-height:.9;font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.reps span{font:500 16px var(--mono);color:var(--cam-sub)}
.joint-tag{position:absolute;background:rgba(14,16,20,.82);border:1px solid var(--cam-line);border-radius:var(--r-sm);padding:6px 10px;display:flex;flex-direction:column;pointer-events:none;transition:transform var(--d2) var(--ease-out)}
.joint-tag small{font:500 var(--fs-xs) var(--mono);color:var(--cam-sub)}.joint-tag b{font-size:22px;font-weight:600;color:var(--signal);font-variant-numeric:tabular-nums}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:160px;font-weight:700;letter-spacing:-.05em;color:#fff;pointer-events:none}
.result{position:absolute;inset:0;background:var(--cam-bg);display:flex;flex-direction:column;justify-content:center;gap:20px;padding:0 var(--s5);animation:fd var(--d3) var(--ease-out)}
.result-ok{position:absolute;left:var(--s3);right:var(--s3);top:calc(env(safe-area-inset-top) + 72px);border-radius:var(--r-lg);background:rgba(212,242,90,.12);border:1px solid rgba(212,242,90,.4);padding:var(--s4) 20px;display:flex;align-items:center;gap:var(--s4);animation:up var(--d3) var(--spring)}
.metric{display:none}/* v2: значение теперь у сустава (.joint-tag) */
.chip{display:none}/* v2: одна подсказка за раз — в .cam-status */
.dark{background:var(--dark);color:var(--cam-text)}

/* шторка */
.sheet{position:fixed;inset:0;background:rgba(10,12,16,.4);display:flex;align-items:flex-end;z-index:20;animation:fdin var(--d3) var(--ease-out)}
.sheet>div{background:var(--bg);width:100%;max-width:480px;max-height:92dvh;overflow:auto;margin:0 auto;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:28px var(--gutter) calc(env(safe-area-inset-bottom) + 28px);position:relative;animation:up var(--d3) var(--ease-out);box-shadow:var(--sh-3)}
#betabar{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(30px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--brand);color:#fff;font:500 12px Onest,sans-serif}
#betabar button{border:0;background:#fff;color:var(--brand);border-radius:999px;padding:4px 10px;font:600 11px Onest,sans-serif;cursor:pointer}
body.beta #app{padding-top:calc(30px + env(safe-area-inset-top))}body.beta .scr{min-height:calc(100dvh - 30px - env(safe-area-inset-top))}
body:has(.cam) #betabar{display:none}body.beta:has(.cam) #app{padding-top:0}
#bugtab{position:fixed;right:0;top:46%;z-index:15;writing-mode:vertical-rl;transform:rotate(180deg);background:var(--ink);color:#fff;border:0;border-radius:0 10px 10px 0;padding:10px 5px;font:600 11px Onest;letter-spacing:.04em;opacity:.55;cursor:pointer}
#bugtab:hover,#bugtab:focus-visible{opacity:1}
body:has(.cam) #bugtab,body:has(.sheet) #bugtab{display:none}
.sheet>div::before{content:'';position:absolute;top:8px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--line)}

/* движение */
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes fdin{from{opacity:0}}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}.vasgood{animation:fd .5s .25s both}
.fade{animation:fd var(--d3) var(--ease-out)}
.stagger>*{animation:fd var(--d3) var(--ease-out) both}
.stagger>*:nth-child(2){animation-delay:calc(var(--stagger)*1)}.stagger>*:nth-child(3){animation-delay:calc(var(--stagger)*2)}
.stagger>*:nth-child(4){animation-delay:calc(var(--stagger)*3)}.stagger>*:nth-child(5){animation-delay:calc(var(--stagger)*4)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;margin:40vh auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .skel{animation:none}.spin{animation-duration:2s}
  *,*::before,*::after{animation-timing-function:linear!important;transition-property:opacity!important}
  @keyframes up{from{opacity:0}}@keyframes fd{from{opacity:0}}@keyframes pop{from{opacity:0}}
}
