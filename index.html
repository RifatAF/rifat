<style>
/* BodyPassport — дизайн-система v3. Заменяет весь блок <style> в index.html.
   Сетка 8pt, 6 радиусов, 3 тени, единая шкала шрифтов. Контраст текста ≥4.5:1 на --bg и --surface. */
:root{
  /* BodyPassport v4: клиент светлый, кабинет специалиста navy (html[data-session=SPECIALIST_OPERATED]). Раскадровка UXUI v2 */
  --bg:#F5F6FA;--surface:#FFFFFF;--surface-2:#EEF0F6;--line:#E1E4EE;--line-2:#ECEEF4;--figure:#E6E9F2;
  --ink:#0B1B3B;--text:#0B1B3B;--sub:#566079;--faint:#8A92A8;
  --focus:#6C63FF;
  /* бренд: navy для главной кнопки, коралловый и фиолетовый акценты; лайм (--signal) только на тёмном фоне камеры */
  --brand:#0B1B3B;--brand-s:#E9EAF8;--accent:#FF7A45;--violet:#6C63FF;--violet-s:#EDECFF;
  --grad:linear-gradient(135deg,#FF7A45 0%,#C255C9 50%,#6C63FF 100%);
  --hero-bg:radial-gradient(120% 80% at 70% 20%,#23306B 0%,#0B1B3B 45%,#060D1F 100%);
  --src-measured:#0B1B3B;--src-hyp:#5148E0;
  /* состояния: заливка / текст / подложка; цвет всегда дублируется формой и словом */
  --over:#EF4444;--over-t:#B42323;--over-s:#FDE8E8;
  --short:#EF4444;--short-t:#B42323;--short-s:#FDE8E8;
  --weak:#3B73D9;--weak-t:#2557B0;--weak-s:#E5EDFB;
  --ok:#22C55E;--ok-t:#15803D;--ok-s:#DCF7E5;
  --edge:#92580A;--edge-s:#FEF1D8;
  /* тёмная тема: камера, упражнения, плашки 3D */
  --cam-bg:#070C18;--cam-glass:rgba(11,18,36,.78);--cam-line:rgba(255,255,255,.14);
  --cam-text:#F5F7FB;--cam-sub:#B6BED0;--signal:#D4F25A;--cam-warn:#F59E0B;--dark:#0B1B3B;
  /* шрифт */
  --font:Manrope,system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --fs-num:56px;--fs-h1:30px;--fs-h2:22px;--fs-h3:17px;--fs-body:16px;--fs-sm:14px;--fs-xs:12px;--fs-cam:44px;--fs-cam-sub:20px;
  /* отступы */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;--gutter:20px;--tap:48px;--btn-h:56px;
  /* радиусы */
  --r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:20px;--r-xl:28px;--r-pill:999px;
  /* тени */
  --sh-1:0 1px 2px rgba(11,27,59,.05),0 2px 8px rgba(11,27,59,.04);
  --sh-2:0 10px 30px rgba(11,27,59,.10),0 2px 6px rgba(11,27,59,.05);
  --sh-3:0 -12px 40px rgba(11,27,59,.18);
  /* движение */
  --ease-out:cubic-bezier(.2,.8,.2,1);--ease-io:cubic-bezier(.65,0,.35,1);--spring:cubic-bezier(.34,1.32,.64,1);
  --d1:120ms;--d2:200ms;--d3:240ms;--d4:560ms;--stagger:60ms;

  /* АЛИАСЫ v2 → v3: старые имена в app.js/pro.js продолжают работать */
  --ink2:#1A2A4F;--coral:var(--short);--coralT:var(--short-t);
  --green:var(--ok);--peach:var(--short-s);--seg:var(--surface-2);
  --hyper:#F59E0B;--hyperS:#FEF1D8;--hyperT:#92580A;--shortS:var(--short-s);--shortT:var(--short-t);
  --weakS:var(--weak-s);--weakT:var(--weak-t);--okS:var(--ok-s);--okT:var(--ok-t);
  --r1:var(--r-sm);--r2:var(--r-md);--r3:var(--r-lg);--r4:var(--r-xl);--sh1:var(--sh-1);--sh2:var(--sh-2);
  --ease:var(--ease-out);--t1:var(--d1);--t2:var(--d3);
}
/* кабинет специалиста: глубокий navy */
:root[data-session=SPECIALIST_OPERATED]{
  color-scheme:dark;
  --bg:#0B1220;--surface:#121C31;--surface-2:#1A2640;--line:#26334F;--line-2:#1E2A44;--figure:#1E2A44;
  --ink:#EEF2FA;--text:#EEF2FA;--sub:#9FAAC2;--faint:#6E7A94;--focus:#8F88FF;
  --brand:#6C63FF;--brand-s:rgba(108,99,255,.2);--violet-s:rgba(108,99,255,.18);
  --src-measured:#EEF2FA;--src-hyp:#9C96FF;
  --over-t:#FF8F8F;--over-s:rgba(239,68,68,.16);--short-t:#FF8F8F;--short-s:rgba(239,68,68,.16);
  --weak-t:#93B4FF;--weak-s:rgba(59,115,217,.2);--ok-t:#5BDB8A;--ok-s:rgba(34,197,94,.16);
  --edge:#F6B54A;--edge-s:rgba(245,158,11,.16);--hyperT:#F6B54A;--hyperS:rgba(245,158,11,.16);
  --ink2:#1A2640;
  --sh-1:0 0 0 1px rgba(255,255,255,.04);--sh-2:0 12px 32px rgba(0,0,0,.45);--sh-3:0 -12px 40px rgba(0,0,0,.5);
}
@media (prefers-reduced-motion:reduce){:root{--d1:1ms;--d2:1ms;--d3:1ms;--d4:160ms;--stagger:0ms}}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs-body);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:var(--ink);font-weight:600}a:hover{color:var(--focus)}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.scr{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.pad{padding:0 var(--gutter)}
h1{font-size:var(--fs-h1);font-weight:700;letter-spacing:-.03em;line-height:1.12;text-wrap:pretty}
h2{font-size:var(--fs-h2);font-weight:700;letter-spacing:-.02em;line-height:1.2}
h3{font-size:var(--fs-h3);font-weight:700;line-height:1.3}
.sub{color:var(--sub);font-size:var(--fs-body);line-height:1.5;text-wrap:pretty}
.caps,.eyebrow{font:500 var(--fs-xs)/1.35 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--sub)}
.num,.kpi b,.measure b{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:var(--s3)}
.stack{display:flex;flex-direction:column;gap:var(--s2)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,a,.list-item,[data-k],[data-id]{transition:transform var(--d1) var(--ease-out),background-color var(--d2),border-color var(--d2),box-shadow var(--d2),opacity var(--d2)}
.btn:active,.pill:active,.list-item:active,.round:active,.tile:active,.tool:active{transform:scale(.97)}

/* иконки */
.ic{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:18px;height:18px}

/* кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;height:var(--btn-h);border:0;border-radius:var(--r-md);background:var(--brand);color:#fff;font:600 17px var(--font);letter-spacing:-.01em;cursor:pointer}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn .meta{font:500 13px var(--mono);color:var(--cam-sub)}
.btn.ghost{background:transparent;color:var(--sub);height:var(--tap);font:500 15px var(--font)}
.btn.line{background:var(--surface);border:1px solid var(--line);color:var(--text)}
.btn.signal,.btn.lime{background:var(--signal);color:var(--cam-bg);font-weight:700}/* только на тёмном */
.round{width:var(--tap);height:var(--tap);border-radius:50%;background:transparent;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.round.glass{background:rgba(14,16,20,.6);color:#fff}
.link{background:none;border:0;padding:0;min-height:var(--tap);font:600 15px var(--font);color:var(--focus);cursor:pointer}

/* нижняя зона большого пальца */
.dock{position:sticky;bottom:0;margin-top:auto;padding:var(--s3) var(--gutter) calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:var(--s1);background:linear-gradient(rgba(245,246,250,0),var(--bg) 24%);z-index:4}
.dock.bar{flex-direction:row;gap:var(--s2);border-top:1px solid var(--line-2);background:rgba(245,246,250,.92);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}

/* поверхности */
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--s4)}
.group{background:var(--surface);border-radius:var(--r-md);padding:0 var(--s4)}
.group>*+*{border-top:1px solid var(--line-2)}
.list-item{display:flex;align-items:center;gap:var(--s3);min-height:64px;background:var(--surface);border-radius:var(--r-md);padding:var(--s3) var(--s4);border:1.5px solid transparent;cursor:pointer}
.list-item.on{border-color:var(--ink)}
.chev{color:var(--faint)}
.bar{width:6px;height:36px;border-radius:3px;flex:none}

/* переключатели */
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-pill);padding:3px}
.seg button{flex:1;min-height:40px;border:0;background:transparent;border-radius:var(--r-pill);padding:0 var(--s4);font:600 14px var(--font);color:var(--sub);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(17,20,24,.08)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 var(--s3);border-radius:var(--r-pill);background:var(--surface-2);font:500 14px var(--font);border:1.5px solid transparent;color:var(--text);cursor:pointer}
.pill.on{border-color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:600}

/* источник, состояние, замер */
.src{display:inline-flex;align-items:center;font:500 var(--fs-xs)/1 var(--mono);letter-spacing:.02em;padding:3px 6px;border-radius:5px;background:var(--src-measured);color:#fff;white-space:nowrap}
.src.hyp{background:transparent;color:var(--src-hyp);border:1px dashed var(--src-hyp);padding:2px 5px}
.edge{display:inline-flex;font-size:var(--fs-xs);font-weight:600;color:var(--edge);background:var(--edge-s);padding:2px 6px;border-radius:5px;white-space:nowrap}
.mark{display:inline-block;flex:none;width:14px;height:14px;box-sizing:border-box}
.mark.HYPER{border-radius:50%;background:var(--hyper)}
.mark.SHORT{width:11px;height:11px;margin:1.5px;background:var(--short);transform:rotate(45deg)}
.mark.WEAK{border-radius:50%;border:3px dashed var(--weak)}.mark.DONE{border-radius:50%;background:#3FAE76}.mark.NT{border-radius:50%;background:var(--line-2);border:2px solid #B9BEC2}
.mark.OK{border-radius:50%;background:var(--ok-s);position:relative}.mark.OK::after{content:'';position:absolute;left:4px;top:2px;width:4px;height:7px;border:solid var(--ok-t);border-width:0 2px 2px 0;transform:rotate(45deg)}
.verdict-row{display:flex;gap:var(--s3);padding:var(--s3) 0}.verdict-row+.verdict-row{border-top:1px solid var(--line-2)}
.verdict-row .mark{margin-top:4px}.verdict-row .what{font-size:var(--fs-h3);line-height:1.3}
.verdict-row .why{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:13px;color:var(--sub)}
.measure{display:flex;align-items:baseline;gap:var(--s2)}
.measure b{font-size:var(--fs-num);line-height:1;font-weight:600;letter-spacing:-.04em}
.measure u{text-decoration:none;font:500 20px var(--mono);color:var(--sub)}
.measure.sm b{font-size:22px;letter-spacing:-.02em}
.mrow{display:flex;align-items:baseline;gap:var(--s2)}.mrow i{font:500 var(--fs-xs) var(--mono);color:var(--sub);font-style:normal}.mrow span{flex:1;font-size:var(--fs-sm);line-height:1.3}.mrow b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.delta{display:flex;align-items:baseline;gap:var(--s3)}.delta s{text-decoration:none;font-size:32px;color:var(--faint);font-variant-numeric:tabular-nums}.delta b{font-size:var(--fs-num);line-height:1;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ondevice{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}

/* плитки и цифры «Сегодня» */
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.kpi div{background:var(--surface);border-radius:var(--r-md);padding:var(--s3)}
.kpi b{display:block;font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.kpi span{font-size:var(--fs-xs);color:var(--sub);line-height:1.3}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
.tool{height:80px;border:0;border-radius:var(--r-md);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:500 var(--fs-xs) var(--font);color:var(--text);cursor:pointer}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}/* v2, оставить до миграции */
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:88px;padding:var(--s4);border:0;border-radius:var(--r-md);background:var(--surface);font:600 15px var(--font);color:var(--text);text-align:left;cursor:pointer}
.tile small{font-weight:400;font-size:var(--fs-xs);color:var(--sub)}
.tile .ti{width:32px;height:32px;border-radius:var(--r-xs);background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.trust{display:none}/* v2: заменён .ondevice */

/* формы */
.field{width:100%;height:56px;border-radius:var(--r-md);border:1.5px solid var(--line);padding:0 var(--s4);font:17px var(--font);background:var(--surface);color:var(--text)}
.field:focus{border-color:var(--ink);outline:none}
.check{width:24px;height:24px;flex:none;accent-color:var(--ink)}
details>summary{cursor:pointer;list-style:none;min-height:var(--tap);display:flex;align-items:center}details>summary::-webkit-details-marker{display:none}

/* состояния: загрузка, пусто, ошибка, тост */
.skel{border-radius:var(--r-md);background:linear-gradient(90deg,var(--surface-2) 0,#F7F6F2 50%,var(--surface-2) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty,.error{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s3);padding:var(--s6) var(--s5)}
.empty .ic,.error .ic{width:40px;height:40px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);max-width:calc(100% - 40px);background:var(--ink);color:#fff;border-radius:var(--r-md);padding:var(--s3) var(--s4);font-size:var(--fs-sm);box-shadow:var(--sh-2);z-index:40;animation:up var(--d3) var(--ease-out)}

/* камера (тёмная тема) */
.cam{position:fixed;inset:0;background:var(--cam-bg);z-index:5;color:var(--cam-text)}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cam video{background:var(--cam-bg)}.cam canvas{background:transparent;pointer-events:none}
.cam .frame{display:none}/* v2 цветная рамка → контур .silhouette + статус */
.cam .silhouette{position:absolute;inset:0;pointer-events:none}
.cam .top{position:absolute;left:var(--gutter);right:var(--s4);top:calc(env(safe-area-inset-top) + 12px);display:flex;align-items:center;gap:var(--s3)}
.segs{flex:1;display:flex;gap:4px}.segs div{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}.segs div b{display:block;height:100%;background:var(--signal);width:0;transition:width .3s linear}
.glass{position:absolute;left:var(--s3);right:var(--s3);bottom:calc(env(safe-area-inset-bottom) + 28px);background:var(--cam-glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--cam-line);border-radius:var(--r-xl);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);color:var(--cam-text)}
.cam-status{display:flex;align-items:center;gap:var(--s2);font:500 var(--fs-xs) var(--mono);letter-spacing:.04em;color:var(--cam-sub)}
.cam-status.warn{color:var(--cam-warn)}.cam-status.ok{color:var(--signal)}
.cam-title{font-size:var(--fs-cam);line-height:1.02;font-weight:700;letter-spacing:-.035em}
.cam-sub{display:flex;gap:var(--s2);font-size:var(--fs-cam-sub);line-height:1.3;color:var(--cam-sub)}

.vnsl-bar{width:min(220px,60vw);height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}.vnsl-bar b{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#FF7A45,#6C63FF);transition:width .25s linear}

/* шторка */
.sheet{position:fixed;inset:0;background:rgba(10,12,16,.4);display:flex;align-items:flex-end;z-index:20;animation:fdin var(--d3) var(--ease-out)}
.sheet>div{background:var(--bg);width:100%;max-width:480px;max-height:92dvh;overflow:auto;margin:0 auto;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:28px var(--gutter) calc(env(safe-area-inset-bottom) + 28px);position:relative;animation:up var(--d3) var(--ease-out);box-shadow:var(--sh-3)}

/* платформы и экраны: длинные блоки кнопок не прилипают к низу; планшет и компьютер шире; телефон боком во время теста */

input,select,textarea{font-size:max(16px,1em)} /* iOS не увеличивает страницу при вводе */

#bugtab:hover,#bugtab:focus-visible{opacity:1}
body:has(.cam) #bugtab,body:has(.sheet) #bugtab{display:none}
.sheet>div::before{content:'';position:absolute;top:8px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--line)}

/* движение */
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes fdin{from{opacity:0}}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}.vasgood{animation:fd .5s .25s both}
.fade{animation:fd var(--d3) var(--ease-out)}
.stagger>*{animation:fd var(--d3) var(--ease-out) both}
.stagger>*:nth-child(2){animation-delay:calc(var(--stagger)*1)}.stagger>*:nth-child(3){animation-delay:calc(var(--stagger)*2)}
.stagger>*:nth-child(4){animation-delay:calc(var(--stagger)*3)}.stagger>*:nth-child(5){animation-delay:calc(var(--stagger)*4)}
.boot{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#110D28}.boot img{width:112px;height:112px;animation:bootp 1.6s ease-in-out infinite}@keyframes bootp{50%{transform:scale(.94)}}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;margin:40vh auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .skel{animation:none}.spin{animation-duration:2s}
  *,*::before,*::after{animation-timing-function:linear!important;transition-property:opacity!important}
  @keyframes up{from{opacity:0}}@keyframes fd{from{opacity:0}}@keyframes pop{from{opacity:0}}
}

/* дополнения приложения к v3 */
[hidden]{display:none!important}
/* .round.glass: не стеклянная панель камеры, а круглая кнопка на тёмном */
.round.glass{position:static;padding:0;border:0;border-radius:50%;gap:0;flex:none}
.dock.bar{width:auto;height:auto;border-radius:0;align-items:stretch}
.badge i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top-bar{display:flex;align-items:center;gap:var(--s2);padding:8px 12px 0}
.top-bar .t{flex:1;min-width:0}.top-bar .t b{display:block;font-size:var(--fs-h3);line-height:1.25}.top-bar .t small{display:block;font-size:13px;color:var(--sub)}
.step-n{font:500 var(--fs-xs) var(--mono);color:var(--sub);letter-spacing:.04em}
.hero{position:relative;height:340px;border-radius:var(--r-xl);background:var(--cam-bg);overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.hero img{opacity:1}
.hero .joint-tag{right:71%;top:71%;transform:translateY(-50%);margin-right:4px}
.hero .joint-tag::after{content:'';position:absolute;right:-23px;top:50%;width:22px;height:1px;background:var(--signal)}
.hero::after{content:'';position:absolute;inset:55% 0 0;background:linear-gradient(transparent,rgba(10,12,15,.72))}
.hero .ondevice{position:absolute;left:16px;bottom:14px;color:#fff;z-index:1}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.chk-row{display:flex;align-items:center;gap:var(--s3);min-height:52px;padding:var(--s2) 0;font-size:var(--fs-sm);line-height:1.35;cursor:pointer}
.chk-row .check{width:22px;height:22px}
.sheet-list{display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s4)}
.row-link{display:flex;align-items:center;gap:var(--s3);min-height:56px;width:100%;background:none;border:0;font:500 16px var(--font);color:var(--text);text-align:left;cursor:pointer;text-decoration:none}
.row-link .ic:first-child{color:var(--sub)}.row-link span{flex:1}
.cam .ondevice{color:var(--cam-sub)}
.dia{display:inline-block;width:8px;height:8px;background:currentColor;transform:rotate(45deg);flex:none;margin:0 2px}
.cam .top .segs{align-self:center}
.mark.sm{width:10px;height:10px}.mark.sm.SHORT{width:8px;height:8px;margin:1px}.mark.sm.WEAK{border-width:2.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--src-hyp);flex:none}
.hyp-card{border:1.5px dashed var(--src-hyp);background:var(--surface);border-radius:var(--r-lg);padding:var(--s4)}
.mark3d{position:absolute;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0;cursor:pointer;transition:opacity var(--d2)}
.hint3d{position:absolute;left:0;right:0;bottom:28px;text-align:center;font-size:12px;color:var(--sub);pointer-events:none;transition:opacity var(--d3)}
.sheet-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface,#fff);color:var(--sub);font-size:17px;line-height:1;cursor:pointer;z-index:2}
.sheet>div>h2:first-of-type{padding-right:40px}
.tip{position:relative;margin-top:-6px}.tip>summary{list-style:none;position:absolute;right:12px;top:-44px;width:30px;height:30px;border-radius:50%;background:var(--surface,#eee);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--sub);cursor:pointer}
.tip>summary::-webkit-details-marker{display:none}
details:not(.tip)>summary:not(:has(svg))::after{content:'▼';margin-left:auto;padding-left:10px;font-size:11px;color:var(--sub);transition:transform .2s}details[open]:not(.tip)>summary:not(:has(svg))::after{transform:rotate(180deg)}
details.acc{background:var(--surface-2,#f3f2ee);border:1px solid var(--line-2);border-radius:12px;padding:0 14px}details.acc[open]{padding-bottom:12px}
.bnav{display:flex;gap:4px;margin-top:var(--s1)}.bnav>button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;border-radius:12px}.bnav>button:active{background:var(--line-2)}.tip>div{margin-top:8px;background:#fff;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;color:var(--sub);border:1px solid var(--line)}
/* анкета по шагам */
.stepper{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--sub);letter-spacing:.04em;text-transform:uppercase}
.stepper i{display:block;width:120px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}.stepper b{display:block;height:100%;background:var(--brand);border-radius:2px;transition:width var(--d3) var(--ease-out)}
.field:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-s)}
.field.big{height:68px;font-size:26px;font-weight:600;letter-spacing:-.01em;border-radius:var(--r-lg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip2{min-height:48px;padding:0 20px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--surface);font:600 15px var(--font);color:var(--text);cursor:pointer}
.chip2.on{background:var(--brand);border-color:var(--brand);color:#fff}.chip2:active{transform:scale(.96)}
.hval{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:8px 0 20px}.hval b{font-size:72px;font-weight:700;letter-spacing:-.04em;line-height:1}.hval span{font-size:20px;color:var(--sub)}
.range{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;touch-action:none}
.range::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--brand-s),var(--brand))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;margin-top:-14px;border-radius:50%;background:#fff;border:2px solid var(--brand);box-shadow:var(--sh-2)}
.range::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--brand-s),var(--brand))}
.range::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--brand);box-shadow:var(--sh-2)}
/* подсказка [?] без лишнего текста на экране */
details.q{display:inline-block;position:relative;vertical-align:middle}details.q>summary{list-style:none;flex:none;min-height:0;padding:0;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 13px var(--font);color:var(--sub);cursor:pointer;background:var(--surface)}
details.q>summary::-webkit-details-marker{display:none}details.q>summary::after{content:none!important}
details.q[open]>summary{background:var(--ink);color:#fff;border-color:var(--ink)}
details.q>div{display:none!important}.qpop{position:fixed;z-index:80;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 24px);max-width:448px;margin:0 auto;background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:18px 48px 18px 18px;font-size:15px;line-height:1.45;box-shadow:0 16px 48px rgba(0,0,0,.35);animation:qup var(--d2) var(--ease-out)}.qpop .mark{vertical-align:middle}.qpop>button{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer}@keyframes qup{from{transform:translateY(16px);opacity:0}}
details.q>div .mark{vertical-align:middle}
/* проценты состояний */
.pct{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;font-size:14px}
.pct .lr{display:flex;gap:3px;height:10px}.pct .lr i{flex:1;position:relative;background:var(--surface-2);border-radius:5px;overflow:hidden}
.pct .lr i b{position:absolute;top:0;bottom:0;border-radius:5px}.pct .lr i:first-child b{right:0}.pct .lr i:last-child b{left:0}
.pct .v{font:600 15px var(--font);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.pct small{grid-column:1/4;margin:-6px 0 4px;font-size:12px;color:var(--sub);display:flex;gap:12px;white-space:nowrap}.pct small span:nth-child(2){flex:1;text-align:center}
.seg.sm button{min-height:34px;font-size:13px;padding:0 12px}
.btn.glass{flex:1;height:48px;background:rgba(255,255,255,.08);border:1px solid var(--cam-line);color:var(--cam-text);font:600 15px var(--font)}.btn.glass:active{background:rgba(255,255,255,.16)}
.ctl3d{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}.ctl3d button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.92);font:600 20px var(--font);color:var(--ink);box-shadow:var(--sh-1);cursor:pointer}.ctl3d button:active{transform:scale(.94);background:var(--surface-2)}

/* ===== v4: раскадровка UXUI v2 ===== */
/* ярлык «Отзыв» перекрывал содержимое и дублировал «Оценить работу» в верхней плашке (аудит, п. 33) */
#bugtab{display:none!important}
:root[data-theme=pro]{color-scheme:dark;--bg:#0B1220;--surface:#121C31;--surface-2:#1A2640;--line:#26334F;--line-2:#1E2A44;--ink:#EEF2FA;--text:#EEF2FA;--sub:#9FAAC2;--faint:#6E7A94;--focus:#8F88FF;--brand:#6C63FF;--brand-s:rgba(108,99,255,.2)}
h1{letter-spacing:-.025em;font-weight:800}h2,h3{font-weight:700}
.btn{border-radius:16px;box-shadow:0 6px 18px rgba(11,27,59,.18)}
.btn.line,.btn.ghost,.btn.glass{box-shadow:none}
.btn.white{background:#fff;color:#0B1B3B;box-shadow:0 10px 30px rgba(0,0,0,.35)}

.card,.list-item,.group,.kpi div,.tile,.tool{box-shadow:var(--sh-1)}

.eyebrow,.caps{font-family:var(--font);font-weight:600;letter-spacing:.02em;text-transform:none;font-size:13px}
/* первый экран */

.welcome-bg{position:absolute;left:0;right:0;top:0;width:100%;height:78%;object-fit:cover;object-position:50% 12%;-webkit-mask-image:linear-gradient(#000 50%,transparent);mask-image:linear-gradient(#000 50%,transparent);pointer-events:none}
.brand-name{font-size:19px;font-weight:800;letter-spacing:-.02em}

.welcome-txt{position:relative;margin-top:auto;padding-top:46vh}
.welcome-kicker{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
.welcome h1{font-size:34px;line-height:1.08;color:#fff}
.welcome p{margin-top:12px;font-size:16px;line-height:1.5;color:rgba(255,255,255,.78)}
.dock.dark-dock{position:relative;background:none;margin-top:0;padding-top:24px}
.on-dark{color:rgba(255,255,255,.82)!important}.link.on-dark{font-size:14px;font-weight:600}
/* кабинет: шапка с силуэтом на экране входа */

/* нижняя навигация */
.bnav>button{color:var(--faint)}.bnav>button.on,.bnav>button[aria-current]{color:var(--ink)}
/* кабинет специалиста: тёмные исключения */
:root[data-session=SPECIALIST_OPERATED] .toast,:root[data-session=SPECIALIST_OPERATED] .qpop{background:#26334F;color:#fff}
