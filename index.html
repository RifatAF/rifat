<style>
:root{--bg:#F4F0E8;--navy:#1E2533;--lime:#C6E84B;--coral:#E8765A;--text:#1C1B19;--sub:#6E6A63;--muted:#8A847A;--faint:#A9A091;--line:#D8D0C2;--line2:#E0D8CA;--seg:#E6DED0;--peach:#FBE8DF;--green:#2E9E6A;
--hyper:#E5484D;--hyperS:#FBE3E1;--short:#EE7B30;--shortS:#FCEAD9;--weak:#3B7BE8;--weakS:#E0E9FA;--ok:#2E9E6A;--okS:#DDF1E6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Onest,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.scr{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.pad{padding:0 20px}
h1{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.12}
.sub{color:var(--sub);font-size:15px;line-height:1.45}
.caps{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border:0;border-radius:20px;background:var(--navy);color:#fff;font:600 17px Onest;cursor:pointer}
.btn .ic{color:var(--lime)}
.btn.lime{background:var(--lime);color:var(--text)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text);height:52px;border-radius:16px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:#fff;font-size:13px;font-weight:500}
.card{background:#fff;border-radius:24px;padding:18px}
.seg{display:flex;background:var(--seg);border-radius:99px;padding:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:99px;padding:10px 14px;font:600 14px Onest;color:var(--text)}
.seg button.on{background:#fff}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700}
.badge i{width:8px;height:8px;border-radius:50%;display:inline-block}
.row{display:flex;align-items:center;gap:12px}
.list-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.55);border-radius:18px;padding:14px;border:1.5px solid transparent;cursor:pointer}
.list-item.on{background:#fff;border-color:var(--navy)}
.bar{width:10px;height:36px;border-radius:5px}
.round{width:44px;height:44px;border-radius:50%;background:#fff;border:0;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.chev{color:var(--faint);font-size:20px}
/* камера */
.cam{position:fixed;inset:0;background:#0E1013;z-index:5}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cam video{background:#0E1013}
.cam canvas{background:transparent;pointer-events:none}
.cam .frame{position:absolute;inset:14px;border:5px solid var(--green);border-radius:36px;transition:border-color .3s}
.cam .top{position:absolute;left:24px;right:16px;top:calc(env(safe-area-inset-top) + 24px)}
.segs{display:flex;gap:5px}.segs div{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}.segs div b{display:block;height:100%;background:var(--lime);width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;color:#fff;font-size:12px;font-weight:500;margin-top:6px}
.glass{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 28px);background:rgba(10,12,15,.72);backdrop-filter:blur(12px);border-radius:28px;padding:20px;display:flex;align-items:center;gap:14px;color:#fff}
.metric{position:absolute;right:26px;top:50%;font:600 12px ui-monospace,monospace;color:var(--lime);background:rgba(198,232,75,.16);border:1px solid rgba(198,232,75,.4);border-radius:8px;padding:6px 10px}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:140px;font-weight:800;color:#fff;pointer-events:none}
/* тренировка */
.dark{background:var(--navy);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:20}
.sheet>div{background:var(--bg);width:100%;max-width:480px;margin:0 auto;border-radius:32px 32px 0 0;padding:24px 20px calc(env(safe-area-inset-bottom) + 30px)}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite;margin:40vh auto}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .35s ease}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
