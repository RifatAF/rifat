# Деплой на Cloudflare Workers при каждом коммите в main (docs/cloudflare_migration.md).
# Нужен секрет репозитория CLOUDFLARE_API_TOKEN; без него шаг деплоя пропускается и сборка не краснеет.
name: Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: cloudflare, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 4dd93185d6026da92474ab3657d65dc7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: node scripts/fetch-assets.mjs
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: npx wrangler deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
